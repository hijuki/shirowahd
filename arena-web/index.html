<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ARENA 2048 — SWHDHLZ</title>
<meta name="description" content="Game 2048 dengan papan skor tersambung WhatsApp.">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Token disamakan dengan halaman utama (app/globals.css v5 "PRESSED PAPER")
   supaya game terasa satu situs, bukan halaman tempelan. */
:root{
  --paper:#fff; --paper-2:#f6f7f9; --sunk:#eceef2;
  --ink:#0b0b0c; --ink-2:#4b4f57; --ink-3:#8b919c;
  --edge:#0b0b0c; --accent:#25d366; --acid:#16a34a; --hot:#ff4d1c; --volt:#2b3bff;
  --bw:2px; --bw-thick:3px; --r:16px; --r-soft:11px; --r-xs:7px; --r-pill:999px;
  --sh:4px 4px 0 var(--edge); --sh-sm:3px 3px 0 var(--edge); --sh-press:1px 1px 0 var(--edge);
  --plate-fill:var(--paper); --fill-strong:var(--ink); --on-fill-strong:#fff;
  --ease:cubic-bezier(.2,.8,.2,1);
  --f-disp:"Archivo Black","Space Grotesk",system-ui,sans-serif;
  --f-sans:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
[data-theme=dark]{
  --paper:#101216; --paper-2:#171a20; --sunk:#0b0d10;
  --ink:#e7e9ee; --ink-2:#9aa0ad; --ink-3:#7c8494;
  --edge:#4a5060; --accent:#3ddc84; --acid:#3ddc84; --hot:#ff7a52; --volt:#8b98ff;
  --plate-fill:#14171d; --fill-strong:#e7e9ee; --on-fill-strong:#101216;
  --sh:4px 4px 0 var(--accent); --sh-sm:3px 3px 0 var(--accent);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper); color:var(--ink); font-family:var(--f-sans);
  min-height:100dvh; overflow-x:hidden;
  padding:14px 14px calc(20px + env(safe-area-inset-bottom));
}
.wrap{max-width:520px;margin:0 auto}
.kicker{font-family:var(--f-mono);font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.data{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.plate{border:var(--bw) solid var(--edge);border-radius:var(--r);background:var(--plate-fill);box-shadow:var(--sh)}
.flat{border:var(--bw) solid var(--edge);border-radius:var(--r-soft);background:var(--paper-2)}

/* ── kepala ── */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.tile-logo{width:36px;height:36px;flex:none;display:grid;place-items:center;border:var(--bw) solid var(--edge);border-radius:var(--r-xs);background:var(--accent);color:#06180d;font-family:var(--f-disp);font-size:15px}
.title{font-family:var(--f-disp);font-size:15px;line-height:1;text-transform:uppercase;letter-spacing:-.02em}
.ibtn{width:36px;height:36px;flex:none;display:grid;place-items:center;border:var(--bw) solid var(--edge);border-radius:var(--r-xs);background:var(--paper-2);color:var(--ink);font-size:15px;cursor:pointer;font-family:var(--f-mono);font-weight:700}
.ibtn:active{transform:translate(1px,1px)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border:var(--bw) solid var(--edge);border-radius:var(--r-pill);background:var(--paper-2);font-family:var(--f-mono);font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ── skor ── */
.skorbar{display:grid;grid-template-columns:1fr 1fr auto;gap:0;margin:12px 0}
.skorbar>div{padding:9px 11px;border-right:var(--bw) solid var(--edge)}
.skorbar>div:last-child{border-right:0}
.skorbar b{display:block;font-family:var(--f-disp);font-size:22px;line-height:1;margin-top:3px}

/* ── papan ── */
#papan{position:relative;aspect-ratio:1;margin-top:2px;padding:8px;background:var(--sunk);border:var(--bw) solid var(--edge);border-radius:var(--r);touch-action:none;user-select:none}
.sel{position:absolute;display:grid;place-items:center;border:var(--bw) solid var(--edge);border-radius:var(--r-xs);font-family:var(--f-disp);line-height:1;transition:left .12s var(--ease),top .12s var(--ease)}
.kosong{position:absolute;border-radius:var(--r-xs);background:rgba(0,0,0,.055);border:1px solid rgba(0,0,0,.05)}
[data-theme=dark] .kosong{background:rgba(255,255,255,.045);border-color:rgba(255,255,255,.05)}
@keyframes muncul{from{transform:scale(.1);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes gabung{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}
.baru{animation:muncul .16s var(--ease) both}
.naik{animation:gabung .2s var(--ease)}

/* ── tombol ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 15px;border:var(--bw) solid var(--edge);border-radius:var(--r-soft);background:var(--paper-2);color:var(--ink);font-family:var(--f-disp);font-size:12px;text-transform:uppercase;letter-spacing:.01em;cursor:pointer;box-shadow:var(--sh-sm);transition:transform .12s var(--ease),box-shadow .12s var(--ease)}
.btn:active{transform:translate(2px,2px);box-shadow:var(--sh-press)}
.btn-utama{background:var(--accent);color:#06180d;border-color:var(--edge)}
.btn-kuat{background:var(--fill-strong);color:var(--on-fill-strong)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.baris{display:flex;gap:8px;margin-top:10px}
.baris .btn{flex:1}

/* ── arah (sentuh) ── */
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
.pad .btn{padding:13px 0;font-size:16px;font-family:var(--f-mono)}
.pad .sp{visibility:hidden}

/* ── papan skor ── */
.pos{display:flex;align-items:center;gap:10px;padding:9px 11px;border-top:var(--bw) solid var(--edge)}
.pos:first-child{border-top:0}
.pos .no{width:24px;flex:none;font-family:var(--f-disp);font-size:13px;color:var(--ink-3)}
.pos[data-aku="1"]{background:color-mix(in srgb,var(--accent) 15%,transparent)}
.pos .nm{flex:1;min-width:0;font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos .sk{font-family:var(--f-mono);font-weight:700;font-size:13px}
.mahkota{color:var(--accent)}

/* ── hamparan ── */
.tutup{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--paper) 82%,transparent);backdrop-filter:blur(3px);border-radius:var(--r);z-index:5;padding:18px;text-align:center}
.tutup h2{font-family:var(--f-disp);font-size:26px;text-transform:uppercase;line-height:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.lap{margin-top:12px;padding:9px 11px;font-family:var(--f-mono);font-size:9.5px;line-height:1.7;letter-spacing:.04em;color:var(--ink-2);word-break:break-word}
a{color:inherit}
</style>
</head>
<body>
<div class="wrap">

  <div class="bar">
    <span class="tile-logo">H</span>
    <span style="flex:1;min-width:0">
      <span class="title">ARENA 2048</span>
      <span class="kicker" style="display:block;margin-top:3px">SWHDHLZ · SKOR DIHITUNG SERVER</span>
    </span>
    <button class="ibtn" id="tTema" aria-label="Ganti mode terang/gelap" title="Mode">◐</button>
  </div>

  <div id="kartuPemain" class="flat" style="padding:9px 11px;display:none;align-items:center;gap:9px">
    <span class="chip"><span class="dot"></span>WHATSAPP</span>
    <span style="flex:1;min-width:0">
      <span class="kicker">MASUK SEBAGAI</span>
      <b id="namaPemain" style="display:block;font-size:13px;margin-top:2px"></b>
    </span>
  </div>

  <div class="plate skorbar" style="box-shadow:var(--sh-sm)">
    <div><span class="kicker">SKOR</span><b class="data" id="skor">0</b></div>
    <div><span class="kicker">TERBAIK</span><b class="data" id="terbaik">0</b></div>
    <div style="display:grid;place-items:center;padding:9px 12px"><span class="kicker" style="text-align:center">LANGKAH<b class="data" id="njumlah" style="display:block;font-family:var(--f-mono);font-size:15px;margin-top:3px">0</b></span></div>
  </div>

  <div id="papan" role="application" aria-label="Papan 2048">
    <div class="tutup" id="tutup" style="display:none">
      <div>
        <h2 id="tutupJudul">SELESAI</h2>
        <p id="tutupTeks" style="font-size:13px;color:var(--ink-2);margin-top:8px;line-height:1.5"></p>
        <button class="btn btn-utama" id="bMainLagi" style="margin-top:14px">MAIN LAGI</button>
      </div>
    </div>
  </div>
  <p class="sr" id="sr" aria-live="polite"></p>

  <div class="pad">
    <span class="btn sp"></span>
    <button class="btn" data-arah="0" aria-label="Atas">↑</button>
    <span class="btn sp"></span>
    <button class="btn" data-arah="3" aria-label="Kiri">←</button>
    <button class="btn" data-arah="2" aria-label="Bawah">↓</button>
    <button class="btn" data-arah="1" aria-label="Kanan">→</button>
  </div>

  <div class="baris">
    <button class="btn btn-kuat" id="bKirim">KIRIM SKOR</button>
    <button class="btn" id="bBaru">ULANG</button>
  </div>

  <div class="plate" style="margin-top:16px">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px;border-bottom:var(--bw) solid var(--edge)">
      <span><span class="kicker">PAPAN SKOR</span><b style="display:block;font-family:var(--f-disp);font-size:14px;text-transform:uppercase;margin-top:2px">10 TERATAS</b></span>
      <button class="ibtn" id="bMuat" aria-label="Muat ulang papan skor" title="Muat ulang">⟳</button>
    </div>
    <div id="papanSkor"><div class="pos"><span class="kicker">MEMUAT…</span></div></div>
  </div>

  <div class="flat lap" id="lap">DIAGNOSTIK…</div>

  <p class="kicker" style="text-align:center;margin-top:14px;line-height:1.8">
    GESER ATAU PAKAI PANAH · SKOR DIVERIFIKASI ULANG DI SERVER<br>
    <a href="/" style="text-decoration:underline">← KEMBALI KE UPLOADER</a>
  </p>
</div>

<script>
'use strict';
/* ══════════════ tema: ikut kunci yang sama dengan situs utama ══════════════ */
var KUNCI_TEMA = 'sw_theme';
function pasangTema(t){ document.documentElement.setAttribute('data-theme', t); try{ localStorage.setItem(KUNCI_TEMA, t); }catch(e){} }
(function(){ var s=null; try{ s=localStorage.getItem(KUNCI_TEMA); }catch(e){}
  document.documentElement.setAttribute('data-theme', s === 'dark' ? 'dark' : 'light'); })();
document.getElementById('tTema').onclick = function(){
  pasangTema(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
};

/* ══════════════ RNG: HARUS sama persis dengan src/lib/hillz-arena.js ══════════════ */
function rngBaru(seed){ var a = seed >>> 0; return function(){
  a = (a + 0x6d2b79f5) >>> 0; var t = a;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

var ATAS=0, KANAN=1, BAWAH=2, KIRI=3;
var P = { p:null, skor:0, seed:0, rng:null, langkah:[], selesai:false, sesi:null, kirim:false };

function tumbuh(st, tandai){
  var kosong=[], i;
  for(i=0;i<16;i++) if(st.p[i]===0) kosong.push(i);
  if(!kosong.length) return -1;
  var idx = kosong[Math.floor(st.rng()*kosong.length)];
  st.p[idx] = st.rng() < 0.9 ? 2 : 4;
  return idx;
}
function jalur(arah,k){ var out=[],i;
  for(i=0;i<4;i++){
    if(arah===KIRI) out.push(k*4+i);
    else if(arah===KANAN) out.push(k*4+(3-i));
    else if(arah===ATAS) out.push(i*4+k);
    else out.push((3-i)*4+k);
  } return out; }
function geser(st,arah){
  var pindah=false, dapat=0, naikDi=[], k,i;
  for(k=0;k<4;k++){
    var idx=jalur(arah,k), nilai=[], hasil=[];
    for(i=0;i<4;i++) if(st.p[idx[i]]!==0) nilai.push(st.p[idx[i]]);
    for(i=0;i<nilai.length;i++){
      if(i+1<nilai.length && nilai[i]===nilai[i+1]){
        var g=nilai[i]*2; hasil.push(g); dapat+=g;
        naikDi.push(idx[hasil.length-1]); i++;
      } else hasil.push(nilai[i]);
    }
    while(hasil.length<4) hasil.push(0);
    for(i=0;i<4;i++){ if(st.p[idx[i]]!==hasil[i]) pindah=true; st.p[idx[i]]=hasil[i]; }
  }
  var barunya=-1;
  if(pindah){ st.skor+=dapat; barunya=tumbuh(st); st.langkah.push(arah); st.selesai=!adaLangkah(st); }
  return { pindah:pindah, dapat:dapat, naikDi:naikDi, barunya:barunya };
}
function adaLangkah(st){ var i,r,c;
  for(i=0;i<16;i++){ if(st.p[i]===0) return true; r=i>>2; c=i&3;
    if(c<3 && st.p[i]===st.p[i+1]) return true;
    if(r<3 && st.p[i]===st.p[i+4]) return true; }
  return false; }

/* ══════════════ warna ubin ══════════════ */
var WARNA = {
  2:['#eef1f6','#0b0b0c'], 4:['#e2e8f2','#0b0b0c'], 8:['#bfe3cd','#0b2b18'],
  16:['#8fd8ae','#062a15'], 32:['#5ccf90','#04240f'], 64:['#25d366','#06180d'],
  128:['#2b3bff','#ffffff'], 256:['#4453ff','#ffffff'], 512:['#6a76ff','#ffffff'],
  1024:['#ff8a2b','#26120a'], 2048:['#ff4d1c','#ffffff']
};
function warna(v){ return WARNA[v] || (v > 2048 ? ['#0b0b0c','#25d366'] : WARNA[2]); }

/* ══════════════ gambar papan ══════════════ */
var papanEl = document.getElementById('papan');
var kosongEl = [];
function siapkanKosong(){
  var i;
  for(i=0;i<16;i++){ var d=document.createElement('div'); d.className='kosong'; papanEl.appendChild(d); kosongEl.push(d); }
  taruhKosong();
}
function ukur(){
  var pad = 8, gap = 7;
  var lebar = papanEl.clientWidth - pad*2;
  var s = (lebar - gap*3) / 4;
  return { pad:pad, gap:gap, s:s };
}
function taruhKosong(){
  var u = ukur(), i;
  for(i=0;i<16;i++){
    var r=i>>2, c=i&3, e=kosongEl[i];
    e.style.width=u.s+'px'; e.style.height=u.s+'px';
    e.style.left=(u.pad + c*(u.s+u.gap))+'px'; e.style.top=(u.pad + r*(u.s+u.gap))+'px';
  }
}
function gambar(naikDi, barunya){
  var u = ukur(), i;
  var lama = papanEl.querySelectorAll('.sel');
  for(i=0;i<lama.length;i++) lama[i].remove();
  for(i=0;i<16;i++){
    var v = P.p[i]; if(!v) continue;
    var r=i>>2, c=i&3, w=warna(v);
    var e=document.createElement('div');
    e.className='sel' + (barunya===i?' baru':'') + ((naikDi && naikDi.indexOf(i)>=0)?' naik':'');
    e.style.width=u.s+'px'; e.style.height=u.s+'px';
    e.style.left=(u.pad + c*(u.s+u.gap))+'px'; e.style.top=(u.pad + r*(u.s+u.gap))+'px';
    e.style.background=w[0]; e.style.color=w[1];
    e.style.fontSize=(v>=1024 ? u.s*0.30 : v>=128 ? u.s*0.36 : u.s*0.42)+'px';
    e.textContent=v;
    papanEl.appendChild(e);
  }
  document.getElementById('skor').textContent = P.skor;
  document.getElementById('njumlah').textContent = P.langkah.length;
  var tb = Number(localStorage.getItem('arena_terbaik') || 0);
  if(P.skor > tb){ tb = P.skor; try{ localStorage.setItem('arena_terbaik', String(tb)); }catch(e){} }
  document.getElementById('terbaik').textContent = tb;
}
window.addEventListener('resize', function(){ taruhKosong(); gambar(); });

/* ══════════════ jalan permainan ══════════════ */
function mainkan(arah){
  if(P.selesai || !P.rng) return;
  var h = geser(P, arah);
  if(!h.pindah) return;
  gambar(h.naikDi, h.barunya);
  bunyi(h.dapat > 0 ? 'gabung' : 'geser');
  if(P.selesai){
    document.getElementById('tutupJudul').textContent = 'HABIS';
    document.getElementById('tutupTeks').textContent = 'Skor ' + P.skor + ' dari ' + P.langkah.length + ' langkah. Kirim ke papan skor?';
    document.getElementById('tutup').style.display = 'grid';
    bunyi('habis');
    document.getElementById('sr').textContent = 'Permainan habis, skor ' + P.skor;
    kirimSkor();
  }
}

/* ══════════════ suara (sintesis, tanpa berkas) ══════════════ */
var AC = null;
function bunyi(jenis){
  try{
    if(!AC){ var K = window.AudioContext || window.webkitAudioContext; if(!K) return; AC = new K(); }
    if(AC.state === 'suspended') AC.resume();
    var t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.connect(g); g.connect(AC.destination);
    if(jenis === 'geser'){ o.type='triangle'; o.frequency.value=440; g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.001,t+.07); o.start(t); o.stop(t+.08); }
    else if(jenis === 'gabung'){ o.type='square'; o.frequency.setValueAtTime(560,t); o.frequency.exponentialRampToValueAtTime(880,t+.09); g.gain.setValueAtTime(.06,t); g.gain.exponentialRampToValueAtTime(.001,t+.12); o.start(t); o.stop(t+.13); }
    else { o.type='sawtooth'; o.frequency.setValueAtTime(300,t); o.frequency.exponentialRampToValueAtTime(120,t+.34); g.gain.setValueAtTime(.07,t); g.gain.exponentialRampToValueAtTime(.001,t+.38); o.start(t); o.stop(t+.4); }
  }catch(e){}
}

/* ══════════════ masukan ══════════════ */
document.addEventListener('keydown', function(e){
  var m = { ArrowUp:ATAS, ArrowRight:KANAN, ArrowDown:BAWAH, ArrowLeft:KIRI,
            w:ATAS, d:KANAN, s:BAWAH, a:KIRI, W:ATAS, D:KANAN, S:BAWAH, A:KIRI };
  if(m[e.key] !== undefined){ e.preventDefault(); mainkan(m[e.key]); }
});
var pads = document.querySelectorAll('[data-arah]');
for(var pi=0; pi<pads.length; pi++)
  pads[pi].addEventListener('click', function(){ mainkan(Number(this.getAttribute('data-arah'))); });

var sx=0, sy=0, adaSentuh=false;
papanEl.addEventListener('touchstart', function(e){ var t=e.changedTouches[0]; sx=t.clientX; sy=t.clientY; adaSentuh=true; }, {passive:true});
papanEl.addEventListener('touchend', function(e){
  if(!adaSentuh) return; adaSentuh=false;
  var t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
  if(Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
  mainkan(Math.abs(dx) > Math.abs(dy) ? (dx>0?KANAN:KIRI) : (dy>0?BAWAH:ATAS));
});

/* ══════════════ token WA dari tautan bot ══════════════ */
var TOKEN = (function(){
  var m = location.search.match(/[?&]t=([^&]+)/);
  if(m) { try{ localStorage.setItem('arena_token', decodeURIComponent(m[1])); }catch(e){} return decodeURIComponent(m[1]); }
  try{ return localStorage.getItem('arena_token') || ''; }catch(e){ return ''; }
})();

/* ══════════════ jaringan ══════════════ */
function kirimJson(jalan, isi){
  return fetch(jalan, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(isi) })
    .then(function(r){ return r.json(); });
}
var laporan = [];
function lapor(){ document.getElementById('lap').textContent = laporan.join(' · '); }

function mulaiBaru(){
  document.getElementById('tutup').style.display = 'none';
  document.getElementById('bKirim').disabled = false;
  document.getElementById('bKirim').textContent = 'KIRIM SKOR';
  return kirimJson('/api/arena/mulai', { token: TOKEN }).then(function(d){
    if(!d.ok) throw new Error(d.error || 'server menolak');
    P.p = new Array(16).fill(0); P.skor = 0; P.seed = d.seed >>> 0;
    P.rng = rngBaru(P.seed); P.langkah = []; P.selesai = false;
    P.sesi = d.sesi; P.kirim = false;
    tumbuh(P); tumbuh(P);
    gambar();
    if(d.pemain){
      document.getElementById('kartuPemain').style.display = 'flex';
      document.getElementById('namaPemain').textContent = d.pemain;
    }
    laporan[0] = 'SESI ✓ seed ' + P.seed;
    laporan[1] = 'WA ' + (d.pemain ? '✓ ' + d.pemain : '✕ tamu');
    lapor();
  }).catch(function(e){
    laporan[0] = 'SESI ✕ ' + e.message; lapor();
    // Tetap bisa main luring; skor cuma tidak bisa dikirim.
    P.p = new Array(16).fill(0); P.skor = 0; P.seed = (Math.random()*4294967296)>>>0;
    P.rng = rngBaru(P.seed); P.langkah = []; P.selesai = false; P.sesi = null;
    tumbuh(P); tumbuh(P); gambar();
  });
}

function kirimSkor(){
  if(P.kirim || !P.sesi || P.langkah.length === 0) return;
  P.kirim = true;
  var b = document.getElementById('bKirim');
  b.disabled = true; b.textContent = 'MENGIRIM…';
  kirimJson('/api/arena/selesai', { sesi:P.sesi, langkah:P.langkah, token:TOKEN }).then(function(d){
    if(!d.ok) throw new Error(d.error || 'ditolak');
    b.textContent = 'TERKIRIM ' + d.skor;
    laporan[2] = 'SKOR SERVER ' + d.skor + (d.skor === P.skor ? ' ✓ cocok' : ' ✕ beda dari layar ' + P.skor);
    laporan[3] = d.peringkat ? 'PERINGKAT #' + d.peringkat.posisi + '/' + d.peringkat.dari : 'PERINGKAT —';
    if(d.wa) laporan[4] = 'WA DIBERITAHU ✓';
    lapor();
    muatPapan();
  }).catch(function(e){
    b.disabled = false; b.textContent = 'COBA KIRIM LAGI'; P.kirim = false;
    laporan[2] = 'KIRIM ✕ ' + e.message; lapor();
  });
}

function muatPapan(){
  // Token ikut dikirim supaya server bisa menandai baris milik pemain ini
  // (`aku:true`). Tanpa ini papan skor selalu terasa milik orang lain.
  var u = '/api/arena/papan?_t=' + Date.now() + (TOKEN ? '&t=' + encodeURIComponent(TOKEN) : '');
  return fetch(u, { cache:'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(d){
      var el = document.getElementById('papanSkor');
      if(!d.ok || !d.papan || !d.papan.length){
        el.innerHTML = '<div class="pos"><span class="kicker">BELUM ADA SKOR — JADILAH YANG PERTAMA</span></div>';
        return;
      }
      var html = '';
      for(var i=0;i<d.papan.length;i++){
        var s = d.papan[i];
        html += '<div class="pos" data-aku="' + (s.aku ? '1' : '0') + '">'
              + '<span class="no' + (i===0?' mahkota':'') + '">' + (i===0?'★':(i+1)) + '</span>'
              + '<span class="nm">' + s.nama + '</span>'
              + '<span class="kicker" style="margin-right:8px">' + s.ubin + '</span>'
              + '<span class="sk">' + s.skor + '</span></div>';
      }
      el.innerHTML = html;
      laporan[5] = 'PAPAN ' + d.papan.length + ' PEMAIN';
      lapor();
    })
    .catch(function(e){
      document.getElementById('papanSkor').innerHTML = '<div class="pos"><span class="kicker">PAPAN GAGAL DIMUAT</span></div>';
    });
}

document.getElementById('bBaru').onclick = function(){ if(!P.kirim && P.langkah.length) kirimSkor(); setTimeout(mulaiBaru, 120); };
document.getElementById('bMainLagi').onclick = function(){ mulaiBaru(); };
document.getElementById('bKirim').onclick = function(){ kirimSkor(); };
document.getElementById('bMuat').onclick = function(){ muatPapan(); };

siapkanKosong();
laporan = ['SESI …','WA …','SKOR —','PERINGKAT —','','PAPAN …'];
lapor();
mulaiBaru().then(muatPapan);
</script>
