<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* Versi BUBBLE: harus di bawah ~14.5k char, tanpa aset luar, tanpa fetch.
   Semua handler ditulis inline (onclick=) karena di bubble itulah bentuk
   yang sudah terbukti hidup. */
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:#0b0d12;color:#e7e9ee;font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px}
.w{max-width:340px;margin:0 auto}
.h{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.m{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(145deg,#3ddc84,#0e7a5f);font-size:18px}
h1{font-size:17px;font-weight:800;letter-spacing:-.02em}
.s{font-size:10px;color:#9aa0ad;letter-spacing:.14em;text-transform:uppercase}
.r{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}
.k{background:#141821;border:1px solid #4a5060;border-radius:10px;padding:8px 10px}
.k span{display:block;font-size:9px;color:#7c8494;letter-spacing:.1em;text-transform:uppercase}
.k b{font-size:17px}
#bank b{color:#f0b429}
#lap{background:#1b2130;border:1px solid #4a5060;border-radius:10px;padding:8px 11px;font-size:12px;margin-bottom:10px;min-height:34px;display:flex;align-items:center}
#p{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}
.c{aspect-ratio:1;border:1px solid #4a5060;border-radius:11px;background:#141821;display:grid;place-items:center;font-size:23px;cursor:pointer;user-select:none}
.c:active{transform:scale(.93)}
.c.o{background:#1b2130;border-color:#3ddc84;cursor:default}
.c.b{background:rgba(239,68,68,.17);border-color:#ef4444}
.c i{font-size:11px;font-weight:700;color:#f0b429;font-style:normal}
.t{display:grid;grid-template-columns:1fr 1fr;gap:7px}
button,a.btn{border:1px solid #4a5060;border-radius:11px;padding:12px 8px;font-size:13px;font-weight:700;background:#141821;color:#e7e9ee;cursor:pointer;box-shadow:3px 3px 0 #4a5060;text-align:center;text-decoration:none;display:block}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #4a5060}
#a{background:#3ddc84;color:#04140d}
a.btn{margin-top:8px;background:#25d366;color:#04140d;box-shadow:3px 3px 0 #4a5060}
#d{margin-top:11px;font-size:10px;color:#7c8494;text-align:center;letter-spacing:.05em}
</style></head><body>
<div class="w">
<div class="h"><div class="m">🎁</div><div><h1>CHEST</h1><div class="s">Di dalam bubble</div></div></div>
<div class="r">
  <div class="k" id="tot"><span>Total</span><b>0</b></div>
  <div class="k" id="bank"><span>Ronde</span><b>0</b></div>
</div>
<div id="lap">Buka peti cari koin. Kena bom, koin ronde hangus.</div>
<div id="p"></div>
<div class="t"><button id="a">AMANKAN</button><button id="n">RONDE BARU</button></div>
<a class="btn" href="https://swhdhlz.my.id/chest" target="_blank" rel="noopener">BUKA VERSI PENUH ↗</a>
<div id="d">probe C1 · html primitive</div>
</div>
<script>
var N=16,tot=0,bank=0,mati=false,pp=[];
function q(s){return document.querySelector(s)}
function baru(){pp=[];for(var i=0;i<N;i++)pp.push({b:false,v:10+Math.floor(Math.random()*81),o:false});
var t=0;while(t<3){var k=Math.floor(Math.random()*N);if(!pp[k].b){pp[k].b=true;t++}}
bank=0;mati=false;q('#lap').textContent='Ada 3 bom di antara 16 peti.';g()}
function g(){var p=q('#p');p.innerHTML='';
for(var i=0;i<N;i++){var s=pp[i],d=document.createElement('div');
d.className='c'+(s.o?' o':'')+(s.o&&s.b?' b':'');
d.innerHTML=s.o?(s.b?'💥':'<i>+'+s.v+'</i>'):(mati&&s.b?'💣':'📦');
if(!s.o&&!mati)d.setAttribute('onclick','buka('+i+')');
p.appendChild(d)}
q('#tot b').textContent=tot;q('#bank b').textContent=bank;
q('#a').disabled=(bank===0||mati)}
function buka(i){if(mati)return;var s=pp[i];if(s.o)return;s.o=true;
if(s.b){mati=true;var h=bank;bank=0;q('#lap').textContent='💥 BOM! '+h+' koin hangus.'}
else{bank+=s.v;var sisa=pp.filter(function(x){return !x.o&&!x.b}).length;
if(sisa===0){mati=true;tot+=bank;q('#lap').textContent='🏆 Bersih! '+bank+' koin masuk total.';bank=0}
else q('#lap').textContent='+'+s.v+' koin. Ronde: '+bank+'. Amankan atau lanjut?'}g()}
q('#a').setAttribute('onclick','if(bank>0&&!mati){tot+=bank;document.querySelector("#lap").textContent="✅ "+bank+" koin diamankan.";bank=0;mati=true;g()}');
q('#n').setAttribute('onclick','baru()');
baru();
</script></body></html>
