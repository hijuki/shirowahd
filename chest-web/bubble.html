<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:#0b1020;color:#e8ecf8;font:13px/1.4 -apple-system,system-ui,sans-serif;padding:10px}
.w{max-width:340px;margin:0 auto}
.hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.t{font-size:15px;font-weight:700;letter-spacing:.5px}
.t b{color:#ffc857}
.sub{font-size:10px;color:#8b96b8}
.gab{display:flex;gap:5px;margin-bottom:8px}
.gab input{flex:1;min-width:0;background:#151c33;border:1px solid #2a3556;color:#e8ecf8;border-radius:7px;padding:7px 9px;font-size:13px}
.b{background:#2563eb;color:#fff;border:0;border-radius:7px;padding:7px 11px;font-size:12px;font-weight:600;cursor:pointer}
.b.g{background:#16a34a}.b.y{background:#a16207}.b:disabled{opacity:.4}
.gr{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:8px 0}
.c{aspect-ratio:1;background:#151c33;border:1px solid #2a3556;border-radius:8px;display:flex;flex-direction:column;
   align-items:center;justify-content:center;font-size:17px;cursor:pointer;position:relative}
.c small{font-size:8px;color:#7c88ab;position:absolute;bottom:2px;max-width:94%;overflow:hidden;white-space:nowrap}
.c.k{background:#0f1830;border-color:#1d2745;cursor:default}
.c.co{background:#1a2f1f;border-color:#2f6b3d;font-size:12px;font-weight:700;color:#86efac}
.c.bm{background:#3a1620;border-color:#7f2337}
.row{display:flex;gap:5px;margin:8px 0}
.row .b{flex:1}
.sk{background:#101830;border:1px solid #1f2a48;border-radius:8px;padding:7px 8px;margin-top:8px}
.sk div{display:flex;justify-content:space-between;padding:2px 0;font-size:12px}
.sk .me{color:#ffc857;font-weight:700}
.sk .tn{color:#4ade80}
.lg{margin-top:7px;font-size:10px;color:#8b96b8;line-height:1.5;max-height:56px;overflow:hidden}
.st{margin-top:7px;padding:6px 8px;border-radius:7px;background:#101830;font-size:11px;color:#a8b3d1;min-height:26px}
.st.e{background:#2a1520;color:#fca5a5}
.dg{margin-top:7px;font-size:9px;color:#5f6a8a;word-break:break-all;line-height:1.5}
</style></head>
<body><div class="w">
<div class="hd"><div class="t">📦 CHEST <b>BERSAMA</b></div><div class="sub" id="rd">ronde -</div></div>

<div class="gab" id="gb">
  <input id="nm" placeholder="nama kamu" maxlength="14" autocomplete="off">
  <button class="b" id="bg">MASUK</button>
</div>

<div class="gr" id="gr"></div>

<div class="row" id="ax" style="display:none">
  <button class="b g" id="ba">AMANKAN <span id="bk">0</span></button>
  <button class="b y" id="bl">LEWAT</button>
</div>

<div class="sk" id="sk"></div>
<div class="lg" id="lg"></div>
<div class="st" id="st">Ketik nama, lalu MASUK.</div>
<div class="dg" id="dg"></div>
</div>
<script>
// URL + token ditanam bot saat mengirim bubble. Bubble tidak punya origin
// tetap, jadi semua state hidup di server; di sini cuma tampilan + polling.
var API='__API__', T='__TOKEN__';
var nama=localStorage.getItem('chest_nama')||'', seq=-1, sibuk=false, timer=null;
var $=function(i){return document.getElementById(i)};

function pesan(t,err){var e=$('st');e.textContent=t;e.className=err?'st e':'st'}

// ── suara: dites, bukan diasumsikan ──────────────────────────────────
// Keluhan "gada suara" belum tentu AudioContext diblokir — bisa juga
// karena butuh user-gesture. Jadi context dibuat DI DALAM tap pertama,
// lalu hasilnya dilaporkan apa adanya ke baris diagnostik.
var AC=null, suaraStatus='belum dites';
function bunyi(hz,dur,jenis){
  try{
    var K=window.AudioContext||window.webkitAudioContext;
    if(!K){suaraStatus='AudioContext tidak ada';return}
    if(!AC)AC=new K();
    if(AC.state==='suspended')AC.resume();
    var o=AC.createOscillator(),g=AC.createGain();
    o.type=jenis||'square';o.frequency.value=hz;
    g.gain.value=.09;o.connect(g);g.connect(AC.destination);
    o.start();o.stop(AC.currentTime+(dur||.09));
    suaraStatus=AC.state;
  }catch(e){suaraStatus='gagal: '+e.message}
  diag();
}
function diag(){
  var s=[];
  try{localStorage.setItem('_p','1');localStorage.removeItem('_p');s.push('LS ok')}catch(e){s.push('LS mati')}
  s.push('audio '+suaraStatus);
  $('dg').textContent='diagnostik: '+s.join(' · ');
}

function req(aksi,data,cb){
  var x=new XMLHttpRequest();
  x.open(aksi==='lihat'?'GET':'POST',API+'/api/chest/'+aksi+(aksi==='lihat'?'?t='+encodeURIComponent(T)+'&nama='+encodeURIComponent(nama):''),true);
  x.timeout=9000;
  if(aksi!=='lihat')x.setRequestHeader('Content-Type','application/json');
  x.onload=function(){var d=null;try{d=JSON.parse(x.responseText)}catch(e){}
    if(!d){pesan('jawaban server tidak terbaca ('+x.status+')',true);return}
    cb(d,x.status)};
  x.onerror=function(){pesan('tidak bisa menghubungi server',true)};
  x.ontimeout=function(){pesan('server lambat menjawab',true)};
  var body=null;
  if(aksi!=='lihat'){data=data||{};data.t=T;data.nama=nama;body=JSON.stringify(data)}
  x.send(body);
}

function gambar(v){
  if(v.seq===seq)return; seq=v.seq;
  $('rd').textContent='ronde '+v.ronde+' · sisa '+v.sisaAman;

  var g=$('gr');g.innerHTML='';
  for(var i=0;i<v.papan.length;i++){
    var s=v.papan[i],d=document.createElement('div');
    if(!s.buka){d.className='c';d.textContent='📦';d.setAttribute('data-i',i)}
    else if(s.bom){d.className='c k bm';d.textContent='💥';d.innerHTML+='<small>'+(s.oleh||'')+'</small>'}
    else{d.className='c k co';d.textContent='+'+s.nilai;d.innerHTML+='<small>'+(s.oleh||'')+'</small>'}
    g.appendChild(d);
  }

  var k=$('sk');k.innerHTML='';
  if(!v.pemain.length)k.innerHTML='<div><span>belum ada pemain</span><span></span></div>';
  for(var j=0;j<v.pemain.length;j++){
    var p=v.pemain[j],r=document.createElement('div');
    r.innerHTML='<span class="'+(p.nama===nama?'me':'')+'">'+(p.giliran?'▶ ':'')+p.nama+'</span>'+
      '<span class="'+(p.giliran?'tn':'')+'">'+p.total+(p.bank?' (+'+p.bank+')':'')+'</span>';
    k.appendChild(r);
  }

  $('lg').innerHTML=v.log.map(function(l){return l.teks}).join('<br>');
  $('gb').style.display=v.aku?'none':'flex';
  $('ax').style.display=v.aku?'flex':'none';
  if(v.aku)$('bk').textContent=v.aku.bank;

  if(v.aku&&!v.akuGiliran)pesan('giliran '+v.giliran+' — tunggu ya');
  else if(v.aku)pesan('giliranmu. Buka peti atau amankan koin.');
}

function lihat(){ if(sibuk)return; req('lihat',null,function(d){if(d.ok)gambar(d)}) }

function aksi(nm,data,hz){
  if(sibuk)return; sibuk=true;
  bunyi(hz||620,.07);
  req(nm,data,function(d,st){
    sibuk=false;
    if(d.papanBaru){seq=-1;gambar(d.papanBaru)}
    if(!d.ok){pesan(d.alasan||'gagal',true);bunyi(200,.16,'sawtooth');return}
    if(d.jenis==='bom'){pesan('💥 kena bom! koin di tangan hangus');bunyi(150,.3,'sawtooth')}
    else if(d.jenis==='bersih'){pesan('🏆 papan bersih! ronde baru');bunyi(900,.2)}
    else if(d.diamankan)pesan('✅ '+d.diamankan+' koin masuk total');
  });
}

$('gr').onclick=function(e){
  var c=e.target.closest?e.target.closest('.c'):null;
  if(!c||c.className.indexOf('k')>=0)return;
  if(!nama){pesan('masuk dulu pakai nama',true);return}
  aksi('buka',{i:+c.getAttribute('data-i')},700);
};
$('bg').onclick=function(){
  var n=($('nm').value||'').trim();
  if(n.length<2){pesan('nama minimal 2 huruf',true);return}
  nama=n; try{localStorage.setItem('chest_nama',n)}catch(e){}
  aksi('gabung',{},800);
};
$('ba').onclick=function(){aksi('amankan',{},760)};
$('bl').onclick=function(){aksi('lewat',{},420)};

if(nama)$('nm').value=nama;
diag();
lihat();
timer=setInterval(lihat,2500);   // bubble tidak bisa di-push, jadi polling
</script></body></html>
