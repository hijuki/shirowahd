<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="g2" x1="30" y1="30" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Outer rounded square -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="#080e1c" stroke="url(#g1)" stroke-width="2.5"/>
  <!-- Inner glow circle -->
  <circle cx="60" cy="56" r="30" fill="url(#g2)" opacity="0.12"/>
  <!-- Upload arrow -->
  <g filter="url(#glow)">
    <path d="M60 32 L60 68" stroke="url(#g2)" stroke-width="5" stroke-linecap="round"/>
    <path d="M44 48 L60 32 L76 48" stroke="url(#g2)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- Cloud base -->
  <path d="M34 64 C34 56 40 50 48 50 C50 42 58 36 68 38 C76 40 82 46 82 54 C88 54 94 60 92 68 C90 74 84 76 78 76 L42 76 C36 76 32 72 34 64Z" fill="none" stroke="url(#g1)" stroke-width="2" opacity="0.5"/>
  <!-- Text SWHDHLZ -->
  <text x="60" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="800" font-size="14" letter-spacing="3" fill="url(#g1)">SWHDHLZ</text>
</svg>
