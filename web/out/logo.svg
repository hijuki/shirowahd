<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Upload">
  <defs>
    <linearGradient id="edge" x1="24" y1="20" x2="96" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9dbcff"/>
      <stop offset="100%" stop-color="#2f5fd8"/>
    </linearGradient>
  </defs>

  <!-- Plate -->
  <rect x="2" y="2" width="116" height="116" rx="28" fill="#0b1220"/>
  <rect x="2.75" y="2.75" width="114.5" height="114.5" rx="27.25" fill="none" stroke="url(#edge)" stroke-width="1.5" opacity="0.5"/>

  <!-- Cloud: symmetric about x=60. Bottom edge is split into two arcs whose round
       caps stop exactly 3px clear of the 8px shaft on BOTH sides (shaft spans
       x56–64; cap outer edge lands at 53 and 67), so the gap is even. -->
  <g fill="none" stroke="url(#edge)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M49 80 L34 80 A15 15 0 0 1 34 50 A30 30 0 0 1 86 50 A15 15 0 0 1 86 80 L71 80"/>
  </g>

  <!-- Arrow: same 8px weight as the cloud -->
  <g fill="none" stroke="#eaf0ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 94 L60 50"/>
    <path d="M45 65 L60 50 L75 65"/>
  </g>
</svg>
